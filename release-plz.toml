# Every crate of the workspace is versioned and released on its own.
# See https://release-plz.ieni.dev/docs/config

[workspace]
# Bump the version according to the API changes, not only the commit messages.
semver_check = true
# Every crate gets its own `CHANGELOG.md`.
changelog_update = true
# A GitHub release per crate would be very noisy. The tags (`<crate>-v<version>`) and the
# changelogs are enough.
git_release_enable = false

[[package]]
name = "leptos-use"
# The deprecated facade keeps the hand-written changelog of the former monolithic crate.
changelog_update = false
semver_check = false

# cargo-semver-checks enables all features, but the `axum` and `actix` features of these crates
# can't be enabled together.
[[package]]
name = "leptos-use-color-mode"
semver_check = false

[[package]]
name = "leptos-use-cookie"
semver_check = false

[[package]]
name = "leptos-use-header"
semver_check = false

[[package]]
name = "leptos-use-locale"
semver_check = false

[[package]]
name = "leptos-use-locales"
semver_check = false

[[package]]
name = "leptos-use-preferences"
semver_check = false
