on:
  pull_request:
  # builds without deploying, so pull requests and releases find the current wasm sizes in the cache
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      remeasure_wasm_sizes:
        description: Measure the wasm sizes of all functions, not only the changed ones
        type: boolean
        default: false
  # deploys the book after a release, see release.yml
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

name: Book

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
          components: rust-src
          cache-workspaces: |
            . -> target
            examples -> target
      - name: Install mdbook and trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,mdbook@0.5
      - name: Measure wasm sizes
        uses: ./.github/actions/measure-wasm-sizes
        with:
          force: ${{ inputs.remeasure_wasm_sizes || false }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build mdbook
        run: |
          cd docs/book
          mdbook build
          python3 post_build.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/book/book
      - name: Deploy book to github pages
        id: deployment
        if: github.event_name == 'workflow_dispatch' || inputs.deploy
        uses: actions/deploy-pages@v5
