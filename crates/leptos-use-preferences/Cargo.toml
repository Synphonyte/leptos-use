[package]
name = "leptos-use-preferences"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive prefers-color-scheme / prefers-contrast / prefers-reduced-motion for Leptos"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-header = { workspace = true }
leptos-use-media-query = { workspace = true }
default-struct-builder = { workspace = true }
http0_2 = { workspace = true, optional = true }
http1 = { workspace = true, optional = true }
leptos = { workspace = true }

[features]
actix = ["dep:http0_2", "leptos-use-header/actix"]
axum = ["dep:http1", "leptos-use-header/axum"]
ssr = ["leptos-use-header/ssr", "leptos-use-media-query/ssr"]
