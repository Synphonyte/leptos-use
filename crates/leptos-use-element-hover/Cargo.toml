[package]
name = "leptos-use-element-hover"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive element's hover state"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-element = { workspace = true }
leptos-use-event-listener = { workspace = true }
default-struct-builder = { workspace = true }
leptos = { workspace = true }
web-sys = { workspace = true, features = ["EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "VisibilityState"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "Event", "EventTarget", "HtmlElement"] }

[features]
ssr = ["leptos-use-element/ssr", "leptos-use-event-listener/ssr"]
