[package]
name = "leptos-use-timestamp"
version = "0.20.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive current timestamp"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-filters = { workspace = true }
leptos-use-interval-fn = { workspace = true }
leptos-use-now = { workspace = true }
leptos-use-raf-fn = { workspace = true }
default-struct-builder = { workspace = true }
leptos = { workspace = true }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }

[features]
ssr = ["leptos-use-filters/ssr", "leptos-use-interval-fn/ssr", "leptos-use-now/ssr", "leptos-use-raf-fn/ssr"]
