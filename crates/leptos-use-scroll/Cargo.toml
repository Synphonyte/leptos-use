[package]
name = "leptos-use-scroll"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive scroll position and state"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-core = { workspace = true }
leptos-use-element = { workspace = true }
leptos-use-event-listener = { workspace = true }
leptos-use-filters = { workspace = true }
leptos-use-fn-debounce-throttle = { workspace = true }
sendwrap-fn = { workspace = true }
cfg-if = { workspace = true }
default-struct-builder = { workspace = true }
leptos = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Element", "Event", "EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "ScrollBehavior", "ScrollToOptions", "VisibilityState"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }

[features]
ssr = ["leptos-use-core/ssr", "leptos-use-element/ssr", "leptos-use-event-listener/ssr", "leptos-use-filters/ssr", "leptos-use-fn-debounce-throttle/ssr"]
