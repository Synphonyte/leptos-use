[package]
name = "leptos-use-active-element"
version = "0.20.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive `document.activeElement`"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-document = { workspace = true }
leptos-use-event-listener = { workspace = true }
leptos-use-option-local-signal = { workspace = true }
leptos-use-window = { workspace = true }
leptos = { workspace = true }
web-sys = { workspace = true, features = ["Element", "EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "VisibilityState"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement"] }

[features]
ssr = ["leptos-use-document/ssr", "leptos-use-event-listener/ssr", "leptos-use-option-local-signal/ssr", "leptos-use-window/ssr"]
