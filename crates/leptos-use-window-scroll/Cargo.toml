[package]
name = "leptos-use-window-scroll"
version = "0.20.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive window scroll"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-event-listener = { workspace = true }
leptos-use-window = { workspace = true }
cfg-if = { workspace = true }
leptos = { workspace = true }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "Window"] }

[features]
ssr = ["leptos-use-event-listener/ssr", "leptos-use-window/ssr"]
