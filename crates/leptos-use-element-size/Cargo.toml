[package]
name = "leptos-use-element-size"
version = "0.20.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive size of an HTML element"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-core = { workspace = true }
leptos-use-element = { workspace = true }
leptos-use-resize-observer = { workspace = true }
leptos-use-watch-with-options = { workspace = true }
cfg-if = { workspace = true }
default-struct-builder = { workspace = true }
leptos = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["DomRectReadOnly", "Element", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverSize", "VisibilityState"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "ResizeObserverBoxOptions"] }

[features]
ssr = ["leptos-use-core/ssr", "leptos-use-element/ssr", "leptos-use-resize-observer/ssr", "leptos-use-watch-with-options/ssr"]
