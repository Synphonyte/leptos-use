[package]
name = "leptos-use-element-visibility"
version = "0.20.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tracks the visibility of an element within the viewport"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-element = { workspace = true }
leptos-use-intersection-observer = { workspace = true }
cfg-if = { workspace = true }
default-struct-builder = { workspace = true }
leptos = { workspace = true }
web-sys = { workspace = true, features = ["DomRect", "Element", "EventTarget", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "VisibilityState"] }

[dev-dependencies]
web-sys = { workspace = true, features = ["Document", "DomRect", "Element", "EventTarget", "HtmlElement", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "VisibilityState"] }
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }

[features]
ssr = ["leptos-use-element/ssr", "leptos-use-intersection-observer/ssr"]
