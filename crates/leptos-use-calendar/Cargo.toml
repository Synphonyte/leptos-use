[package]
name = "leptos-use-calendar"
version = "0.20.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Create bare-bone calendar data to use in your component"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["chrono", "ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-maybe-rw-signal = { workspace = true }
chrono = { workspace = true, optional = true }
default-struct-builder = { workspace = true }
jiff = { workspace = true, optional = true }
leptos = { workspace = true }
time = { workspace = true, optional = true }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }

[features]
default = ["chrono"]
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]
ssr = ["leptos-use-maybe-rw-signal/ssr"]
time = ["dep:time"]
