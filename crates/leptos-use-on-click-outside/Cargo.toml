[package]
name = "leptos-use-on-click-outside"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Listen for clicks outside an element"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-element = { workspace = true }
leptos-use-event-listener = { workspace = true }
leptos-use-window = { workspace = true }
sendwrap-fn = { workspace = true }
cfg-if = { workspace = true }
default-struct-builder = { workspace = true }
lazy_static = { workspace = true }
leptos = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "Node", "NodeList", "UiEvent", "VisibilityState", "Window"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlElement", "Node"] }

[features]
ssr = ["leptos-use-element/ssr", "leptos-use-event-listener/ssr", "leptos-use-window/ssr"]
