[package]
name = "leptos-use-locales"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive locales"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-event-listener = { workspace = true }
leptos-use-header = { workspace = true }
leptos-use-window = { workspace = true }
default-struct-builder = { workspace = true }
http0_2 = { workspace = true, optional = true }
http1 = { workspace = true, optional = true }
leptos = { workspace = true }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "Navigator", "Window"] }

[features]
actix = ["dep:http0_2", "leptos-use-header/actix"]
axum = ["dep:http1", "leptos-use-header/axum"]
ssr = ["leptos-use-event-listener/ssr", "leptos-use-header/ssr", "leptos-use-window/ssr"]
