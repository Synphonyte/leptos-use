[package]
name = "leptos-use-clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive [Clipboard API](https://developer.mozilla.org/en-US/docs/Web/API/Clipboard_API)"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-event-listener = { workspace = true }
leptos-use-supported = { workspace = true }
leptos-use-timeout-fn = { workspace = true }
sendwrap-fn = { workspace = true }
wasm-js-macros = { workspace = true }
default-struct-builder = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Clipboard", "EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "PermissionState", "PermissionStatus", "Permissions", "VisibilityState"] }

[features]
ssr = ["leptos-use-event-listener/ssr", "leptos-use-supported/ssr", "leptos-use-timeout-fn/ssr"]
