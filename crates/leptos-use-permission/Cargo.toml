[package]
name = "leptos-use-permission"
version = "0.20.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reactive [Permissions API](https://developer.mozilla.org/en-US/docs/Web/API/Permissions_API)"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-event-listener = { workspace = true }
wasm-js-macros = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "PermissionState", "PermissionStatus", "Permissions", "VisibilityState"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Navigator", "PermissionState", "PermissionStatus", "Permissions", "Window"] }

[features]
ssr = ["leptos-use-event-listener/ssr"]
