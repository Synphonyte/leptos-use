[package]
name = "leptos-use-event-listener"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Use EventListener with ease"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-element = { workspace = true }
leptos-use-watch-with-options = { workspace = true }
sendwrap-fn = { workspace = true }
cfg-if = { workspace = true }
default-struct-builder = { workspace = true }
leptos = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["AddEventListenerOptions", "EventListenerOptions", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "VisibilityState"] }

[dev-dependencies]
leptos-use-document = { path = "../leptos-use-document" }
web-sys = { workspace = true, features = ["AddEventListenerOptions", "Document", "Element", "Event", "EventListenerOptions", "EventTarget", "HtmlDivElement", "HtmlElement", "KeyboardEvent", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "VisibilityState", "Window"] }
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }

[features]
ssr = ["leptos-use-element/ssr", "leptos-use-watch-with-options/ssr"]
