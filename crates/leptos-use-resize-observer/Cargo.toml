[package]
name = "leptos-use-resize-observer"
version = "0.20.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reports changes to the dimensions of an Element's content or the border-box"
keywords = ["leptos", "utilities", "reactive"]
categories = ["gui", "wasm", "web-programming"]
readme = "README.md"

[package.metadata.docs.rs]
features = ["ssr"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

[lints]
workspace = true

[dependencies]
leptos-use-element = { workspace = true }
leptos-use-supported = { workspace = true }
sendwrap-fn = { workspace = true }
wasm-js-macros = { workspace = true }
cfg-if = { workspace = true }
default-struct-builder = { workspace = true }
js-sys = { workspace = true }
leptos = { workspace = true }
send_wrapper = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["DomRectReadOnly", "Element", "EventTarget", "MediaQueryList", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "NodeList", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverOptions", "VisibilityState"] }

[dev-dependencies]
gloo-timers = { workspace = true, features = ["futures"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
any_spawner = { workspace = true, features = ["wasm-bindgen"] }
js-sys = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "DomRectReadOnly", "Element", "HtmlElement", "ResizeObserver", "ResizeObserverBoxOptions", "ResizeObserverEntry", "ResizeObserverSize"] }

[features]
ssr = ["leptos-use-element/ssr", "leptos-use-supported/ssr"]
