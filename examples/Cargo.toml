leptos-use-device-pixel-ratio = { path = "../crates/leptos-use-device-pixel-ratio" }
leptos-use-display-media = { path = "../crates/leptos-use-display-media" }
leptos-use-docs = { path = "../crates/leptos-use-docs" }
leptos-use-document = { path = "../crates/leptos-use-document" }
leptos-use-document-visibility = { path = "../crates/leptos-use-document-visibility" }
leptos-use-draggable = { path = "../crates/leptos-use-draggable" }
