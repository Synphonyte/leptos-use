[package]
name = "leptos-use-ssr"
version = "0.1.0"
edition = "2024"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "start-axum"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
style-file = "style/main.scss"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

[package.metadata.cargo-all-features]
denylist = ["axum", "tokio", "tower", "tower-http", "leptos_axum"]
skip_feature_sets = [["ssr", "hydrate"]]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos-use-color-mode = { path = "../../crates/leptos-use-color-mode" }
leptos-use-cookie = { path = "../../crates/leptos-use-cookie" }
leptos-use-event-listener = { path = "../../crates/leptos-use-event-listener" }
leptos-use-fn-debounce-throttle = { path = "../../crates/leptos-use-fn-debounce-throttle" }
leptos-use-interval = { path = "../../crates/leptos-use-interval" }
leptos-use-intl-number-format = { path = "../../crates/leptos-use-intl-number-format" }
leptos-use-locales = { path = "../../crates/leptos-use-locales" }
leptos-use-preferences = { path = "../../crates/leptos-use-preferences" }
leptos-use-storage = { path = "../../crates/leptos-use-storage" }
leptos-use-timestamp = { path = "../../crates/leptos-use-timestamp" }
leptos-use-window = { path = "../../crates/leptos-use-window" }
axum = { version = "0.8", optional = true }
codee = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
cfg-if = "1"
leptos = { version = "0.9.0-rc0" }
leptos_axum = { version = "0.9.0-rc0", optional = true }
leptos_meta = "0.9.0-rc0"
leptos_router = { version = "0.9.0-rc0" }
log = "0.4"
simple_logger = "5"
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-default-headers = { git = "https://github.com/banool/tower-default-headers-rs" }
tower-http = { version = "0.7", features = ["fs"], optional = true }
wasm-bindgen = "0.2"
thiserror = "2"
tracing = { version = "0.1", optional = true }
http = "1"

[features]
hydrate = ["leptos/hydrate"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:leptos_axum",
  "dep:tracing",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "leptos-use-color-mode/ssr",
  "leptos-use-cookie/ssr",
  "leptos-use-event-listener/ssr",
  "leptos-use-fn-debounce-throttle/ssr",
  "leptos-use-interval/ssr",
  "leptos-use-intl-number-format/ssr",
  "leptos-use-locales/ssr",
  "leptos-use-preferences/ssr",
  "leptos-use-storage/ssr",
  "leptos-use-timestamp/ssr",
  "leptos-use-window/ssr",
  "leptos-use-color-mode/axum",
  "leptos-use-cookie/axum",
  "leptos-use-locales/axum",
  "leptos-use-preferences/axum",
]
