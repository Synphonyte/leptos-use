[package]
name = "use_active_element"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
leptos-use-active-element = { path = "../../crates/leptos-use-active-element" }
leptos-use-docs = { path = "../../crates/leptos-use-docs" }
web-sys = { version = "0.3", features = ["HtmlElement", "DomStringMap"] }

[dev-dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-test = { workspace = true }
